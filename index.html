<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selamat Ulang Tahun 🎂</title>

<!-- Font & Style -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle at bottom, #ffb6c1, #ff69b4, #8b008b);
    height: 100vh;
    overflow: hidden;
    color: white;
    text-align: center;
  }

  h1 {
    font-size: 2em;
    margin-top: 60px;
    animation: fadeIn 3s ease-in-out;
  }

  p {
    font-size: 1.2em;
    margin-top: 15px;
    opacity: 0;
    animation: fadeInText 5s ease forwards;
    animation-delay: 3s;
  }

  .gallery {
    margin-top: 40px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 15px;
  }

  .gallery img {
    width: 150px;
    border-radius: 15px;
    box-shadow: 0 4px 12px rgba(255,255,255,0.3);
    transform: scale(0.8);
    transition: transform 0.5s ease;
    animation: fadeIn 2s ease;
  }

  .gallery img:hover {
    transform: scale(1);
  }

  audio {
    margin-top: 20px;
    outline: none;
  }

  /* Animasi fade */
  @keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
  }

  @keyframes fadeInText {
    to {opacity: 1;}
  }

  /* Bintang jatuh */
  .star {
    position: fixed;
    top: 0;
    width: 2px;
    height: 80px;
    background: linear-gradient(white, rgba(255,255,255,0));
    opacity: 0.8;
    animation: fall 3s linear infinite;
  }

  @keyframes fall {
    0% { transform: translateY(0) translateX(0); opacity: 1; }
    100% { transform: translateY(100vh) translateX(50vw); opacity: 0; }
  }

  footer {
    position: absolute;
    bottom: 20px;
    width: 100%;
    font-size: 0.9em;
    opacity: 0.7;
  }
</style>
</head>
<body>

<h1>Selamat Ulang Tahun Sayang 🎉</h1>
<p>Terima kasih sudah menjadi bagian terindah dalam hidupku.  
Setiap senyum dan kenangan bersamamu akan selalu aku simpan di hati 💖</p>

<div class="gallery">
  <img src="https://via.placeholder.com/300x400.png?text=Kenangan+1" alt="Kenangan 1">
  <img src="https://via.placeholder.com/300x400.png?text=Kenangan+2" alt="Kenangan 2">
  <img src="https://via.placeholder.com/300x400.png?text=Kenangan+3" alt="Kenangan 3">
</div>

<audio autoplay loop>
  <source src="https://docs.google.com/uc?export=open&id=1qWJNYJzErYgFFoBfZ7m3-5n3-WoI5B8N" type="audio/mp3">
  Browser kamu tidak mendukung audio.
</audio>

<footer>💫 Dengan cinta — dari seseorang yang selalu mengingatmu 💫</footer>

<script>
  // Buat efek bintang jatuh
  function createStar() {
    const star = document.createElement("div");
    star.classList.add("star");
    star.style.left = Math.random() * window.innerWidth + "px";
    star.style.animationDuration = 2 + Math.random() * 3 + "s";
    document.body.appendChild(star);
    setTimeout(() => { star.remove(); }, 3000);
  }
  setInterval(createStar, 200);
</script>

</body>
</html>
